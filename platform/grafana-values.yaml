persistence:
  enabled: true
  size: 1Gi
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 384Mi
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        url: http://prometheus-server.monitoring.svc
        access: proxy
        isDefault: true