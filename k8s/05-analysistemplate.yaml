apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: podinfo-canary
  namespace: prj2
spec:
  args:
    - name: canary-hash
  metrics:
    - name: ty-le-loi-5xx
      initialDelay: 60s
      interval: 30s
      failureLimit: 1
      successCondition: result[0] <= 0.05
      failureCondition: result[0] > 0.05
      provider:
        prometheus:
          address: http://prometheus-server.monitoring.svc
          query: |
            (sum(rate(http_request_duration_seconds_count{namespace="doan2", rollouts_pod_template_hash="{{args.canary-hash}}", path!~"healthz|readyz|metrics", status=~"5.."}[1m])) or vector(0))
            /
            sum(rate(http_request_duration_seconds_count{namespace="doan2", rollouts_pod_template_hash="{{args.canary-hash}}", path!~"healthz|readyz|metrics"}[1m]))
    - name: do-tre-p95
      initialDelay: 60s
      interval: 30s
      failureLimit: 1
      successCondition: result[0] <= 0.5
      failureCondition: result[0] > 0.5
      provider:
        prometheus:
          address: http://prometheus-server.monitoring.svc
          query: |
            histogram_quantile(0.95,
              sum by (le) (rate(http_request_duration_seconds_bucket{namespace="doan2", rollouts_pod_template_hash="{{args.canary-hash}}", path!~"healthz|readyz|metrics"}[1m])))